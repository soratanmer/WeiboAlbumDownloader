name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: WeiboAlbumDownloader.sln
      Configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    # 还原解决方案依赖
    - name: Restore
      run: dotnet restore "${{ env.Solution_Name }}"

    # 构建 WPF 应用（Release），在 Windows runner 上编译验证
    - name: Build
      run: dotnet build "${{ env.Solution_Name }}" --configuration "${{ env.Configuration }}" --no-restore

    # 下载静态 FFmpeg 并随程序一起分发（动态照片合成的视频容器重建依赖它）
    - name: Download FFmpeg
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $out -Force
        $exe = Get-ChildItem -Path $out -Recurse -Filter ffmpeg.exe | Select-Object -First 1
        if (-not $exe) { throw '未在 FFmpeg 压缩包中找到 ffmpeg.exe' }
        Copy-Item $exe.FullName "WeiboAlbumDownloader\bin\Release\net6.0-windows\ffmpeg.exe" -Force

    # 上传构建产物
    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: WeiboAlbumDownloader_Build
        path: WeiboAlbumDownloader/bin/Release/net6.0-windows/
