name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: WeiboAlbumDownloader.sln
      Test_Project_Path: your-test-project-path
      Wap_Project_Directory: your-wap-project-directory-name
      Wap_Project_Path: your-wap-project-path
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Build Release
      run: dotnet build -c Release

    - name: Execute unit tests
      run: dotnet test

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: WeiboAlbumDownloader_Build
        path: ./WeiboAlbumDownloader/bin/Release/net10.0-windows/
